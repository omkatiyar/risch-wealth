# RISCH Wealth — host nginx config
#
# Server: Ubuntu, 80.225.229.175 — DNS for rischwealth.com (and www) must
# point here before requesting a TLS cert.
#
# This nginx only does one job: terminate TLS and reverse-proxy
# everything to the Dockerized frontend container, which is published to
# 127.0.0.1:8080 by docker-compose.yml at the repo root. That container's
# own nginx (fe/docker/nginx.conf) serves the built React app and proxies
# /api to the backend container internally — this file doesn't need to
# know about /api, static file paths, or SPA fallback at all.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rischwealth.com
#   sudo ln -s /etc/nginx/sites-available/rischwealth.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (after DNS points here, and docker compose is already running):
#   sudo certbot --nginx -d rischwealth.com -d www.rischwealth.com
#   (certbot rewrites the server block below to add certificate paths and
#   the automatic HTTP -> HTTPS redirect — you don't write that by hand)

server {
    listen 80;
    listen [::]:80;
    server_name rischwealth.com www.rischwealth.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Requests that hit the server by bare IP or an unknown host (not
# rischwealth.com/www) shouldn't be served at all.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
