# Runs inside the frontend container. Serves the built React app and
# proxies /api to the backend container over the Docker network (they
# share a network because they're both defined in the same
# docker-compose.yml — "backend" resolves via Docker's internal DNS).
#
# The host's nginx (deploy/nginx.conf) only needs to reverse-proxy
# everything to this container's published port — it doesn't need to
# know about /api at all, that's handled here instead.

# Text assets were going out uncompressed (the JS bundle alone is ~350 KB
# raw, ~100 KB gzipped). Images are already compressed, so they're left out.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/ld+json image/svg+xml;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Behind the host nginx, an absolute redirect would point at this
    # container (http, port 80). Relative Location headers avoid that.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Every route is prerendered to its own file at build time
    # (scripts/prerender.mjs): /about -> about.html. Anything else is a
    # real 404, rather than the home page served with a 200.
    # /about/ -> /about, so each page has exactly one URL
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri.html $uri/ =404;
        # HTML must be re-checked so a deploy shows up immediately; the
        # hashed files under /assets/ are cached for a year instead.
        add_header Cache-Control "no-cache";
    }

    # Staff portal: every /employee-portal/... path (e.g. a client's page,
    # /employee-portal/clients/12) is the same app page; React picks the
    # screen from the URL.
    location ^~ /employee-portal/ {
        try_files $uri /employee-portal.html;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:4000/health;
    }

    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
