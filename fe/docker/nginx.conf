# Runs inside the frontend container. Serves the built React app and
# proxies /api to the backend container over the Docker network (they
# share a network because they're both defined in the same
# docker-compose.yml — "backend" resolves via Docker's internal DNS).
#
# The host's nginx (deploy/nginx.conf) only needs to reverse-proxy
# everything to this container's published port — it doesn't need to
# know about /api at all, that's handled here instead.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:4000/health;
    }

    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
